name: Build Mitra Theatre

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # This adds a manual "Run workflow" button

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build Windows Executable
        run: pyinstaller mitra_theatre.spec
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitraTheatre-Windows
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fix Line Endings (Just in case!)
        run: sed -i '' 's/\r$//' create_dmg.sh
      - name: Build macOS App & DMG
        run: |
          pyinstaller mitra_theatre_macos.spec
          chmod +x create_dmg.sh
          ./create_dmg.sh
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitraTheatre-macOS
          path: "*.dmg"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile with PyInstaller
        run: pyinstaller mitra_theatre.spec
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Package AppImage
        run: |
          wget -q -c "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          
          mkdir -p AppDir/usr/bin
          # Accommodate whether pyinstaller outputs to dist/mitra_theatre or dist/"Mitra Theatre"
          cp -r dist/mitra_theatre/* AppDir/usr/bin/ || cp -r dist/"Mitra Theatre"/* AppDir/usr/bin/
          
          convert icon.ico[0] icon.png || cp icon.ico icon.png
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/mitra_theatre" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          cat << 'EOF' > AppDir/mitra_theatre.desktop
          [Desktop Entry]
          Type=Application
          Name=Mitra Theatre
          Exec=mitra_theatre
          Icon=icon
          Categories=Utility;
          Terminal=false
          EOF
          cp icon.png AppDir/
          
          ARCH=x86_64 ./squashfs-root/AppRun AppDir Mitra_Theatre-x86_64.AppImage
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitraTheatre-Linux
          path: "*.AppImage"
  create-release:
    needs: [build-windows, build-macos, build-linux] # Waits for builds to finish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Mitra Theatre Build ${{ github.run_number }}"
          files: |
            MitraTheatre-Windows-Installer/*.exe
            MitraTheatre-macOS/*.dmg
            MitraTheatre-Linux/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
